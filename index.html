<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuotiXX - Inicio de Sesión</title>

    <link rel="stylesheet" href="CSS/Configuración general.css">
<link rel="stylesheet" href="CSS/Encabezado.css">
<link rel="stylesheet" href="CSS/Contenido principal.css">
<link rel="stylesheet" href="CSS/Títulos.css">
<link rel="stylesheet" href="CSS/Formularios.css">
<link rel="stylesheet" href="CSS/Botones.css">
<link rel="stylesheet" href="CSS/Enlaces.css">
<link rel="stylesheet" href="CSS/Pie de página.css">
<link rel="stylesheet" href="CSS/Login.css">
<link rel="stylesheet" href="CSS/Adaptación celular.css">

</head>

<body>

    <!-- ENCABEZADO -->

    <header>

        <h1>🛠️ QuotiXX 📐</h1>

        <p>
            Cotización para Carpintería
        </p>

    </header>


    <!-- CONTENIDO PRINCIPAL -->

    <main>

        <!-- BIENVENIDA -->

        <section>

            <h2>
                Bienvenido 🪵
            </h2>

            <p>
                Inicia sesión para continuar
            </p>

        </section>


        <!-- FORMULARIO DE LOGIN -->

        <form>

            <!-- USUARIO -->

            <div>

                <label for="usuario">
                    👤 Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Escribe tu usuario..."
                    required
                >

            </div>


            <!-- CONTRASEÑA -->

            <div>

                <label for="contrasena">
                    🔒 Contraseña
                </label>

                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Escribe tu contraseña..."
                    required
                >

            </div>


            <!-- RECUPERAR CONTRASEÑA -->

            <div>

                <a href="#">
                    ¿Olvidaste tu contraseña?
                </a>

            </div>


            <!-- BOTÓN INICIAR SESIÓN -->

            <div>

                <button type="submit">
                    ➜ Iniciar Sesión
                </button>

            </div>

        </form>


        <!-- OPCIÓN INVITADO -->

        <section>

            <p>
                ───────── o continúa con ─────────
            </p>

            <button type="button">
                👤 Invitado
            </button>

        </section>


        <!-- MENSAJE -->

        <section>

            <div>
                🧰
            </div>

            <p>
                Construimos tus ideas en madera
            </p>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->

    <footer>

        <p>
            Versión 1.0 &nbsp; © 2026 QuotiXX
        </p>

    </footer>

</body>

</html>
