<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotixx - Inicio de Sesión</title>

    <!-- Configuración Base -->
    <link rel="stylesheet" href="css/Configuración general.css">

    <!-- Estructura y Capas -->
    <link rel="stylesheet" href="css/Encabezado.css">
    <link rel="stylesheet" href="css/Contenido principal.css">
    <link rel="stylesheet" href="css/Secciones.css">
    <link rel="stylesheet" href="css/Pie de página.css">

    <!-- Componentes e Interfaz -->
    <link rel="stylesheet" href="css/Títulos.css">
    <link rel="stylesheet" href="css/Formularios.css">
    <link rel="stylesheet" href="css/Buscadores.css">
    <link rel="stylesheet" href="css/Botones.css">
    <link rel="stylesheet" href="css/Enlaces.css">
    <link rel="stylesheet" href="css/Menú principal.css">
    <link rel="stylesheet" href="css/Tarjetas.css">
    <link rel="stylesheet" href="css/Login.css">

    <!-- Adaptación Móvil -->
    <link rel="stylesheet" href="css/Adaptación celular.css">
</head>

<body>

    <header>
        <h1>🛠️ Quotixx 📐</h1>
        <p>Cotización para Carpintería</p>
    </header>

    <main>

        <section>
            <h2>Bienvenido 😊</h2>
            <p>Inicia sesión para continuar</p>
        </section>

        <form id="formLogin">

            <div>
                <label for="usernameLogin">👤 Usuario</label>
                <input 
                    type="text" 
                    id="usernameLogin" 
                    placeholder="Escribe tu usuario..." 
                    required
                >
            </div>

            <div>
                <label for="passwordLogin">🔒 Contraseña</label>
                <input 
                    type="password" 
                    id="passwordLogin" 
                    placeholder="Escribe tu contraseña..." 
                    required
                >
            </div>

            <div>
                <a href="Olvidaste_tu_contraseña.html">¿Olvidaste tu contraseña?</a>
            </div>

            <br>

            <div>
                <button type="submit">Iniciar Sesión</button>
            </div>

            <div>
                <p>
                    ¿No tienes una cuenta? <a href="registro.html">Regístrate</a>
                </p>
            </div>

        </form>

        <br><br><br>

        <section>
            <div>
                <p style="text-align: center;">
                    Construimos tus ideas en madera 🧰
                </p>
            </div>
        </section>

    </main>

    <footer>
        <p>Versión 1.0 &nbsp; © 2026 Quotixx</p>
    </footer>

    <script src="js/main.js"></script>

</body>

</html>
