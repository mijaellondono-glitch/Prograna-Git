<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotixx - Catálogo de Cocinas</title>

    <!-- Configuración Base -->
    <link rel="stylesheet" href="css/Configuración general.css">

    <!-- Estructura y Capas -->
    <link rel="stylesheet" href="css/Encabezado.css">
    <link rel="stylesheet" href="css/Contenido principal.css">
    <link rel="stylesheet" href="css/Secciones.css">
    <link rel="stylesheet" href="css/Pie de página.css">

    <!-- Componentes e Interfaz -->
    <link rel="stylesheet" href="css/Títulos.css">
    <link rel="stylesheet" href="css/Formularios.css">
    <link rel="stylesheet" href="css/Buscadores.css">
    <link rel="stylesheet" href="css/Botones.css">
    <link rel="stylesheet" href="css/Enlaces.css">
    <link rel="stylesheet" href="css/Menú principal.css">
    <link rel="stylesheet" href="css/Tarjetas.css">
    <link rel="stylesheet" href="css/Login.css">

    <!-- Adaptación Móvil -->
    <link rel="stylesheet" href="css/Adaptación celular.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header>
        <h1>🛠️ Quotixx 📐</h1>
        <p>Cotización para Carpintería</p>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <!-- TÍTULO DE LA SECCIÓN -->
        <section>
            <h2>🍳 Catálogo de Cocinas</h2>
            <p>Lista de cocinas integrales y muebles de cocina registrados en el sistema.</p>
        </section>

        <br>

        <!-- BOTÓN PARA AGREGAR NUEVA COCINA -->
        <section>
            <a href="agregar-al-catalogo.html">
                <button type="button">➕ Agregar Nueva Cocina</button>
            </a>
        </section>

        <br><br>

        <!-- BUSCADOR -->
        <section>
            <label for="buscarCocina">🔍 Buscar cocina</label>
            <input
                type="search"
                id="buscarCocina"
                name="buscarCocina"
                placeholder="Buscar en cocinas..."
            >
        </section>

        <br><br>

        <!-- CONTENEDOR DE COCINAS REGISTRADAS (VACÍO) -->
        <section id="listaCocinas">
            <!-- Aquí se cargarán dinámicamente las cocinas que agregues -->
        </section>

        <br><br>

        <!-- NAVEGACIÓN DE REGRESO -->
        <section>
            <a href="catalogo.html">◀️ Volver a Categorías</a>
        </section>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>Versión 1.0 &nbsp; © 2026 Quotixx</p>
    </footer>

</body>

</html>
