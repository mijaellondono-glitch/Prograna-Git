<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuotiXX - Configuración</title>

    <link rel="stylesheet" href="CSS/Configuración general.css">
<link rel="stylesheet" href="CSS/Encabezado.css">
<link rel="stylesheet" href="CSS/Contenido principal.css">
<link rel="stylesheet" href="CSS/Títulos.css">
<link rel="stylesheet" href="CSS/Formularios.css">
<link rel="stylesheet" href="CSS/Botones.css">
<link rel="stylesheet" href="CSS/Enlaces.css">
<link rel="stylesheet" href="CSS/Secciones.css">
<link rel="stylesheet" href="CSS/Pie de página.css">
<link rel="stylesheet" href="CSS/Adaptación celular.css">

</head>

<body>

    <!-- ENCABEZADO -->

    <header>

        <h1>🛠️ QuotiXX 📐</h1>

        <p>
            Cotización para Carpintería
        </p>

    </header>


    <!-- CONTENIDO PRINCIPAL -->

    <main>

        <!-- TÍTULO -->

        <section>

            <h2>
                ⚙️ Configuración
            </h2>

            <p>
                Administra las opciones generales de la aplicación.
            </p>

        </section>


        <!-- INFORMACIÓN DEL NEGOCIO -->

        <section>

            <h3>
                🏪 Información del negocio
            </h3>

            <div>

                <label for="nombreNegocio">
                    Nombre del negocio
                </label>

                <input
                    type="text"
                    id="nombreNegocio"
                    name="nombreNegocio"
                    value="Carpintería"
                >

            </div>


            <div>

                <label for="telefonoNegocio">
                    📞 Teléfono
                </label>

                <input
                    type="tel"
                    id="telefonoNegocio"
                    name="telefonoNegocio"
                    placeholder="Número de teléfono"
                >

            </div>


            <div>

                <label for="correoNegocio">
                    📧 Correo electrónico
                </label>

                <input
                    type="email"
                    id="correoNegocio"
                    name="correoNegocio"
                    placeholder="Correo electrónico"
                >

            </div>

        </section>


        <!-- PREFERENCIAS -->

        <section>

            <h3>
                🔧 Preferencias
            </h3>


            <div>

                <label for="moneda">
                    💰 Moneda
                </label>

                <select id="moneda" name="moneda">

                    <option value="COP">
                        Peso colombiano (COP)
                    </option>

                    <option value="USD">
                        Dólar estadounidense (USD)
                    </option>

                </select>

            </div>


            <div>

                <label for="notificaciones">
                    🔔 Notificaciones
                </label>

                <select id="notificaciones" name="notificaciones">

                    <option value="activadas">
                        Activadas
                    </option>

                    <option value="desactivadas">
                        Desactivadas
                    </option>

                </select>

            </div>

        </section>


        <!-- INFORMACIÓN DE LA APLICACIÓN -->

        <section>

            <h3>
                ℹ️ Información de la aplicación
            </h3>

            <p>
                Nombre: QuotiXX
            </p>

            <p>
                Versión: 1.0
            </p>

            <p>
                © 2026 QuotiXX
            </p>

        </section>


        <!-- BOTONES -->

        <section>

            <button type="button">
                💾 Guardar cambios
            </button>

            <a href="inicio.html">
                ◀️ Volver
            </a>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->

    <footer>

        <p>
            Versión 1.0 &nbsp; © 2026 QuotiXX
        </p>

    </footer>


</body>

</html>
