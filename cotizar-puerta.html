<body>

    <header>
        <h1>🛠️ Quotixx 📐</h1>

        <p>
            Cotización para Carpintería
        </p>
    </header>




<main>


        <section>

            <h2>
                Cotización de Puerta
            </h2>

            <p>
                Ingresa las dimensiones de la puerta que deseas cotizar. Asegúrate de proporcionar medidas precisas para obtener un presupuesto exacto.
            </p>

        </section>

<br><br>
   

<div>  
    <label for="alto">
        📏 Alto (en cm)
    </label>
    <input 
        type="number" 
        id="alto" 
        name="alto" 
        placeholder="Ingresa el alto de la puerta"
        min="0"
        max="300"
        required>
</div>

<br>

<div>
    <label for="ancho">
        📏 Ancho (en cm)
    </label>
    <input 
        type="number" 
        id="ancho" 
        name="ancho" 
        placeholder="Ingresa el ancho de la puerta"
        min="0"
        max="150"
        required>
</div>

<br>

<div>
    <label for="grosor">
        🔍 Grosor del marco (en cm)
    </label>
    <input 
        type="number" 
        id="grosor" 
        name="grosor" 
        placeholder="Ingresa el grosor del marco"
        min="0"
        max="10"
        required>
</div>

<br>

<div>
    <label for="Sentido de apertura">
        ↔️ Sentido de apertura
    </label>
    <select id="Sentido de apertura" name="Sentido de apertura" required>
        <option value="">Selecciona una opción</option>
        <option value="izquierda">Izquierda</option>
        <option value="derecha">Derecha</option>
    </select>
</div>





</main>

<footer>

        <p>
            Versión 1.0 &nbsp; © 2026 Quotixx
        </p>

    </footer>
    
</body>
</html>
