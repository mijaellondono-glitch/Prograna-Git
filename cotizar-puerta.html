<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotixx - Cotizar Puertas</title>

    <!-- Configuración Base -->
    <link rel="stylesheet" href="css/Configuración general.css">

    <!-- Estructura y Capas -->
    <link rel="stylesheet" href="css/Encabezado.css">
    <link rel="stylesheet" href="css/Contenido principal.css">
    <link rel="stylesheet" href="css/Secciones.css">
    <link rel="stylesheet" href="css/Pie de página.css">

    <!-- Componentes e Interfaz -->
    <link rel="stylesheet" href="css/Títulos.css">
    <link rel="stylesheet" href="css/Formularios.css">
    <link rel="stylesheet" href="css/Buscadores.css">
    <link rel="stylesheet" href="css/Botones.css">
    <link rel="stylesheet" href="css/Enlaces.css">
    <link rel="stylesheet" href="css/Menú principal.css">
    <link rel="stylesheet" href="css/Tarjetas.css">
    <link rel="stylesheet" href="css/Login.css">

    <!-- Adaptación Móvil -->
    <link rel="stylesheet" href="css/Adaptación celular.css">
</head>

<body>

    <header>
        <h1>🛠️ Quotixx 📐</h1>
        <p>Cotización para Carpintería</p>
    </header>

    <main>

        <section>
            <h2>🚪 Cotizador de Puertas</h2>
            <p>Configura las medidas y opciones de la puerta para calcular el precio total</p>
        </section>

        <form id="formCotizarPuerta">

            <div>
                <label for="clienteInput">👤 Nombre del Cliente</label>
                <input 
                    type="text" 
                    id="clienteInput" 
                    placeholder="Ej: Juan Pérez" 
                    required
                >
            </div>

            <div>
                <label for="telefonoClienteInput">📞 Teléfono del Cliente</label>
                <input 
                    type="tel" 
                    id="telefonoClienteInput" 
                    placeholder="Ej: 3001234567" 
                    required
                >
            </div>

            <div>
                <label for="tipoPuerta">🛠️ Tipo de Puerta</label>
                <select id="tipoPuerta" required>
                    <option value="650000" data-nombre="Puerta Entamborada Normal">Puerta Entamborada Normal ($650.000)</option>
                    <option value="880000" data-nombre="Puerta Corrediza con Riel">Puerta Corrediza con Riel ($880.000)</option>
                    <option value="1150000" data-nombre="Puerta Maciza">Puerta Maciza ($1.150.000)</option>
                </select>
            </div>

            <div>
                <label for="anchoInput">📐 Ancho (en cm)</label>
                <input 
                    type="number" 
                    id="anchoInput" 
                    value="90" 
                    min="50" 
                    max="250" 
                    required
                >
            </div>

            <div>
                <label for="altoInput">📏 Alto (en cm)</label>
                <input 
                    type="number" 
                    id="altoInput" 
                    value="210" 
                    min="100" 
                    max="300" 
                    required
                >
            </div>

            <div>
                <label for="color">🎨 Color</label>
                <select id="color" name="color" required>
                    <option value="">Selecciona una opción</option>
                    <option value="blanco">Blanco</option>
                    <option value="negro wengue">negro wengue</option>
                    <option value="miel">miel</option>
                    <option value="caramelo">caramelo</option>
                </select>
            </div>

            <div>
                <label for="incluyeChapa">🔑 ¿Incluye Chapa/Cerradura?</label>
                <select id="incluyeChapa">
                    <option value="0">No (El cliente la proporciona)</option>
                    <option value="30000">Sí (+ $30.000)</option>
                </select>
            </div>

            <br>

            <section>
                <div style="text-align: center;">
                    <h3>Total Estimado:</h3>
                    <h2 id="precioTotal" style="color: #004085; font-size: 1.8rem;">$650.000 COP</h2>
                </div>
            </section>

            <br>

            <div>
                <button type="submit" id="btnGenerar">📄 Descargar Cotización PDF</button>
            </div>

            <br>

            <div>
                <p style="text-align: center;">
                    <a href="inicio.html">← Volver al Panel Principal</a>
                </p>
            </div>

        </form>

    </main>

    <footer>
        <p>Versión 1.0 &nbsp; © 2026 Quotixx</p>
    </footer>

    <!-- Cargar API_BASE_URL desde main.js -->
    <script src="js/main.js"></script>

    <script>
       const tipoPuerta = document.getElementById('tipoPuerta');
        const anchoInput = document.getElementById('anchoInput');
        const altoInput = document.getElementById('altoInput');
        const incluyeChapa = document.getElementById('incluyeChapa');
        const precioTotalEl = document.getElementById('precioTotal');
        const clienteInput = document.getElementById('clienteInput');
        const colorInput = document.getElementById('color');

        function calcularDatos() {
            const precioBase = parseFloat(tipoPuerta.value);
            const anchoMetros = parseFloat(anchoInput.value || 0) / 100;
            const altoMetros = parseFloat(altoInput.value || 0) / 100;
            const chapa = parseFloat(incluyeChapa.value);

            const areaM2 = anchoMetros * altoMetros;
            const areaEstandard = 1.98; // 0.90m x 2.20m
            let recargoExceso = 0;

            if (areaM2 > areaEstandard) {
                const m2Extra = areaM2 - areaEstandard;
                const tarifaExtra = precioBase >= 1150000 ? 220000 : 150000;
                recargoExceso = m2Extra * tarifaExtra;
            }

            const total = precioBase + recargoExceso + chapa;

            return {
                precioBase,
                anchoMetros,
                altoMetros,
                areaM2,
                recargoExceso,
                chapa,
                total
            };
        }

        function actualizarPantalla() {
            const datos = calcularDatos();
            precioTotalEl.textContent = `$${Math.round(datos.total).toLocaleString('es-CO')} COP`;
        }

        [tipoPuerta, anchoInput, altoInput, incluyeChapa].forEach(element => {
            element.addEventListener('change', actualizarPantalla);
            element.addEventListener('input', actualizarPantalla);
        });

        // ENVÍO AL BACKEND Y DESCARGA DIRECTA DEL PDF
        document.getElementById('formCotizarPuerta').addEventListener('submit', async (e) => {
            e.preventDefault();

            const datos = calcularDatos();
            const cliente = clienteInput.value.trim();
            const telefonoCliente = document.getElementById('telefonoClienteInput').value.trim();
            const color = colorInput.value.trim();
            const tipoNombre = tipoPuerta.options[tipoPuerta.selectedIndex].getAttribute('data-nombre');

            const payload = {
                cliente,
                telefonoCliente,
                nombreNegocio: localStorage.getItem('nombreNegocio') || '',
                telefonoNegocio: localStorage.getItem('telefonoNegocio') || '',
                correoNegocio: localStorage.getItem('correoNegocio') || '',
                direccionNegocio: localStorage.getItem('direccionNegocio') || '',
                tipoNombre,
                ancho: anchoInput.value,
                alto: altoInput.value,
                areaM2: datos.areaM2.toFixed(2),
                color,
                chapa: datos.chapa,
                total: datos.total
            };

            try {
                const baseUrl = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'https://quotixx-backend.onrender.com';

                const respuesta = await fetch(`${baseUrl}/api/auth/cotizar-puerta-pdf`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!respuesta.ok) throw new Error('Error al solicitar el PDF al backend');

                const blob = await respuesta.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Cotizacion_Puerta_${cliente.replace(/\s+/g, '_')}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);

                // Guardar en el historial (Clientes + Historial quedan sincronizados)
                fetch(`${baseUrl}/api/cotizaciones`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        clienteNombre: cliente,
                        clienteTelefono: telefonoCliente,
                        tipoMueble: 'puerta',
                        detalle: `${tipoNombre} - ${color}`,
                        total: datos.total
                    })
                }).catch((err) => console.error('No se pudo guardar en el historial:', err));

            } catch (error) {
                console.error(error);
                alert('No se pudo generar el archivo PDF. Verifica la conexión con el servidor.');
            }
        });
    </script>

</body>

</html>
