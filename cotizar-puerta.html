<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotización de Puerta - Quotixx</title>

    <!-- Configuración Base -->
    <link rel="stylesheet" href="css/Configuración general.css">

    <!-- Estructura y Capas -->
    <link rel="stylesheet" href="css/Encabezado.css">
    <link rel="stylesheet" href="css/Contenido principal.css">
    <link rel="stylesheet" href="css/Secciones.css">
    <link rel="stylesheet" href="css/Pie de página.css">

    <!-- Componentes e Interfaz -->
    <link rel="stylesheet" href="css/Títulos.css">
    <link rel="stylesheet" href="css/Formularios.css">
    <link rel="stylesheet" href="css/Buscadores.css">
    <link rel="stylesheet" href="css/Botones.css">
    <link rel="stylesheet" href="css/Enlaces.css">
    <link rel="stylesheet" href="css/Menú principal.css">
    <link rel="stylesheet" href="css/Tarjetas.css">
    <link rel="stylesheet" href="css/Login.css">

    <!-- Adaptación Móvil -->
    <link rel="stylesheet" href="css/Adaptación celular.css">
</head>

<body>

    <header>
        <h1>🛠️ Quotixx 📐</h1>
        <p>Cotización para Carpintería</p>
    </header>

    <main>
        <section>
            <h2>Cotización de Puerta</h2>
            <p>
                Ingresa las dimensiones de la puerta que deseas cotizar. Asegúrate de proporcionar medidas precisas para obtener un presupuesto exacto.
            </p>
        </section>

        <br><br>

        <!-- ABRIMOS LA ETIQUETA FORM AQUÍ -->
        <form action="/cotizar-puerta" method="POST">

            <div>
                <label for="tipoPuerta">🚪 Tipo de puerta</label>
                <select id="tipoPuerta" name="tipoPuerta" required>
                    <option value="">Selecciona una opción</option>
                    <option value="Corrediza">Corrediza</option>
                    <option value="Normal">Normal</option>
                    <option value="Maciza">Maciza</option>
                </select>
            </div>
               
            <br>

            <div>   
                <label for="alto">📏 Alto (en cm)</label>
                <input 
                    type="number" 
                    id="alto" 
                    name="alto" 
                    placeholder="Ingresa el alto de la puerta"
                    min="0"
                    max="300"
                    required>
            </div>

            <br>

            <div>
                <label for="ancho">📏 Ancho (en cm)</label>
                <input 
                    type="number" 
                    id="ancho" 
                    name="ancho" 
                    placeholder="Ingresa el ancho de la puerta"
                    min="0"
                    max="150"
                    required>
            </div>

            <br>

            <div>
                <label for="grosor">🔍 Grosor del marco (en cm)</label>
                <input 
                    type="number" 
                    id="grosor" 
                    name="grosor" 
                    placeholder="Ingresa el grosor del marco"
                    min="0"
                    max="10"
                    required>
            </div>

            <br>

            <div>
                <label for="apertura">↔️ Sentido de apertura</label>
                <select id="apertura" name="apertura" required>
                    <option value="">Selecciona una opción</option>
                    <option value="izquierda">Izquierda</option>
                    <option value="derecha">Derecha</option>
                </select>
            </div>

            <br>

            <div>
                <label for="color">🎨 Color</label>
                <select id="color" name="color" required>
                    <option value="">Selecciona una opción</option>
                    <option value="blanco">Blanco</option>
                    <option value="negro wengue">negro wengue</option>
                    <option value="miel">miel</option>
                    <option value="caramelo">caramelo</option>
                </select>
            </div>

            <br><br>

            <!-- Cambiado tipo a submit y corregida la etiqueta a section -->
            <section>
                <button type="submit">💰 Cotizar</button>
            </section>

        </form> 
        <!-- CERRAMOS LA ETIQUETA FORM AQUÍ -->

        <br>

        <section>
            <a href="nueva-cotizacion.html">◀️ Volver</a>
        </section>

    </main>

    <footer>
        <p>Versión 1.0 &nbsp; © 2026 Quotixx</p>
    </footer>
    
</body>
</html>
