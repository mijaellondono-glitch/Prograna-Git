<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Código - QuotiXX</title>

    <!-- Configuración Base -->
    <link rel="stylesheet" href="css/Configuración general.css">
    <link rel="stylesheet" href="css/Encabezado.css">
    <link rel="stylesheet" href="css/Contenido principal.css">
    <link rel="stylesheet" href="css/Secciones.css">
    <link rel="stylesheet" href="css/Pie de página.css">
    <link rel="stylesheet" href="css/Títulos.css">
    <link rel="stylesheet" href="css/Formularios.css">
    <link rel="stylesheet" href="css/Botones.css">
    <link rel="stylesheet" href="css/Adaptación celular.css">
</head>
<body>
    <header>
        <h1>🛠️ QuotiXX 📐</h1>
        <p>Cotización para Carpintería</p>
    </header>

    <main>
        <h2>📩 Revisa tu Correo</h2>
        <p>Hemos enviado un código de seguridad a tu correo electrónico. Ingrésalo a continuación:</p>

        <form action="restablecer_contraseña.html" method="POST">
            <div>
                <label for="code">Código de Verificación:</label>
                <input type="text" id="code" name="code" placeholder="Ej. 123456" maxlength="6" required>
            </div>

            <button type="submit">Verificar Código</button>
        </form>

        <br>
        <p>¿No recibiste el código? <a href="olvidastes_tu_contraseña.html">Reenviar</a></p>
    </main>

    <footer>
        <p>Versión 1.0 © 2026 QuotiXX</p>
    </footer>
</body>
</html>
