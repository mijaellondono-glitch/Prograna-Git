<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotización de Cama - Quotixx</title>

    <!-- Configuración Base -->
    <link rel="stylesheet" href="css/Configuración general.css">

    <!-- Estructura y Capas -->
    <link rel="stylesheet" href="css/Encabezado.css">
    <link rel="stylesheet" href="css/Contenido principal.css">
    <link rel="stylesheet" href="css/Secciones.css">
    <link rel="stylesheet" href="css/Pie de página.css">

    <!-- Componentes e Interfaz -->
    <link rel="stylesheet" href="css/Títulos.css">
    <link rel="stylesheet" href="css/Formularios.css">
    <link rel="stylesheet" href="css/Buscadores.css">
    <link rel="stylesheet" href="css/Botones.css">
    <link rel="stylesheet" href="css/Enlaces.css">
    <link rel="stylesheet" href="css/Menú principal.css">
    <link rel="stylesheet" href="css/Tarjetas.css">
    <link rel="stylesheet" href="css/Login.css">

    <!-- Adaptación Móvil -->
    <link rel="stylesheet" href="css/Adaptación celular.css">
</head>

<body>

    <header>
        <h1>🛠️ Quotixx 📐</h1>
        <p>Cotización para Carpintería</p>
    </header>

    <main>
        <section>
            <h2>Cotización de Cama</h2>
            <p>
                Selecciona las características y dimensiones de la cama que deseas cotizar. Elige los complementos necesarios para obtener un presupuesto exacto.
            </p>
        </section>

        <br><br>

        <form action="/cotizar-cama" method="POST">

            <div>
                <label for="tamano">🛏️ Tamaño de la cama</label>
                <select id="tamano" name="tamano" required>
                    <option value="">Selecciona una opción</option>
                    <option value="sencilla">Sencilla (1.00m x 1.90m)</option>
                    <option value="semidoble">Semidoble (1.20m x 1.90m)</option>
                    <option value="doble">Doble (1.40m x 1.90m)</option>
                    <option value="queen">Queen (1.60m x 1.90m)</option>
                    <option value="king">King (2.00m x 2.00m)</option>
                </select>
            </div>
               
            <br>

            <div>
                <label for="cabecero">🪵 Tipo de cabecero</label>
                <select id="cabecero" name="cabecero" required>
                    <option value="">Selecciona una opción</option>
                    <option value="sin_cabecero">Sin cabecero (Solo base)</option>
                    <option value="cabecero_liso">Cabecero liso de madera</option>
                    <option value="cabecero_flotante">Cabecero flotante de pared</option>
                    <option value="cabecero_tapizado">Cabecero tapizado</option>
                </select>
            </div>

            <br>

            <div>
                <label for="mesitas">🌙 Juego con mesitas de noche</label>
                <select id="mesitas" name="mesitas" required>
                    <option value="">Selecciona una opción</option>
                    <option value="sin_mesitas">Solo la cama (Sin mesitas)</option>
                    <option value="una_mesita">Cama + 1 Mesita de noche</option>
                    <option value="dos_mesitas">Cama + 2 Mesitas de noche</option>
                </select>
            </div>

            <br>

            <div>
                <label for="almacenamiento">📦 Espacio de almacenamiento</label>
                <select id="almacenamiento" name="almacenamiento" required>
                    <option value="">Selecciona una opción</option>
                    <option value="base_sencilla">Base sencilla (Sin cajones)</option>
                    <option value="cajones_inferiores">Con cajones inferiores</option>
                    <option value="baul_abatible">Con baúl abatible (Cama hidráulica)</option>
                </select>
            </div>

            <br>

            <div>
                <label for="material">🪵 Material principal</label>
                <select id="material" name="material" required>
                    <option value="">Selecciona una opción</option>
                    <option value="melamina">Melamina / Aglomerado</option>
                    <option value="madera_solida">Madera Sólida</option>
                    <option value="triplay">Triplay de Pino</option>
                </select>
            </div>

            <br>

            <div>
                <label for="color">🎨 Color</label>
                <select id="color" name="color" required>
                    <option value="">Selecciona una opción</option>
                    <option value="blanco">Blanco</option>
                    <option value="miel">Miel</option>
                    <option value="caramelo">Caramelo</option>
                    <option value="wengue">Negro Wengué</option>
                </select>
            </div>

            <br><br>

            <section>
                <button type="submit">💰 Cotizar</button>
            </section>

        </form> 

        <br>

        <section>
            <a href="nueva-cotizacion.html">◀️ Volver</a>
        </section>

    </main>

    <footer>
        <p>Versión 1.0 &nbsp; © 2026 Quotixx</p>
    </footer>
    
</body>
</html>
