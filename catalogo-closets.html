<html lang="es">

<head>

    <!-- Configuración Base -->
    <link rel="stylesheet" href="css/Configuración general.css">

    <!-- Estructura y Capas -->
    <link rel="stylesheet" href="css/Encabezado.css">
    <link rel="stylesheet" href="css/Contenido principal.css">
    <link rel="stylesheet" href="css/Secciones.css">
    <link rel="stylesheet" href="css/Pie de página.css">

    <!-- Componentes e Interfaz -->

<body>

    <!-- ENCABEZADO -->
    <header>
        <h1>🛠️ Quotixx 📐</h1>
        <p>Cotización para Carpintería</p>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <!-- TÍTULO DE LA SECCIÓN -->
        <section>
            <h2>🗄️ Catálogo de Closets</h2>
            <p>Lista de closets y vestidores registrados en el sistema.</p>
        </section>

        <br>

        <!-- BOTÓN PARA AGREGAR NUEVO CLOSET -->
        <section>
            <a href="agregar-al-catalogo.html">
                <button type="button">➕ Agregar Nuevo Closet</button>
            </a>
        </section>

        <br><br>

        <!-- BUSCADOR -->
        <section>
            <label for="buscarCloset">🔍 Buscar closet</label>
            <input
                type="search"
                id="buscarCloset"
                name="buscarCloset"
                placeholder="Buscar en closets..."
            >
        </section>

        <br><br>

        <!-- CONTENEDOR DE CLOSETS REGISTRADOS (VACÍO) -->
        <section id="listaClosets">
            <!-- Aquí se cargarán dinámicamente los closets que agregues -->
        </section>

        <br><br>

        <!-- NAVEGACIÓN DE REGRESO -->
        <section>
            <a href="catalogo.html">◀️ Volver a Categorías</a>
        </section>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>Versión 1.0 &nbsp; © 2026 Quotixx</p>
    </footer>
    <script>
        window.CATALOGO_CATEGORIA = 'closets';
        window.CATALOGO_CONTENEDOR = 'listaClosets';
        window.CATALOGO_BUSCADOR = 'buscarCloset';
    </script>
    <script src="js/main.js"></script>
    <script src="js/catalogo.js"></script>

</body>
