<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotización de Closet - Quotixx</title>

    <!-- Configuración Base -->
    <link rel="stylesheet" href="css/Configuración general.css">

    <!-- Estructura y Capas -->
    <link rel="stylesheet" href="css/Encabezado.css">
    <link rel="stylesheet" href="css/Contenido principal.css">
    <link rel="stylesheet" href="css/Secciones.css">
    <link rel="stylesheet" href="css/Pie de página.css">

    <!-- Componentes e Interfaz -->
    <link rel="stylesheet" href="css/Títulos.css">
    <link rel="stylesheet" href="css/Formularios.css">
    <link rel="stylesheet" href="css/Buscadores.css">
    <link rel="stylesheet" href="css/Botones.css">
    <link rel="stylesheet" href="css/Enlaces.css">
    <link rel="stylesheet" href="css/Menú principal.css">
    <link rel="stylesheet" href="css/Tarjetas.css">
    <link rel="stylesheet" href="css/Login.css">

    <!-- Adaptación Móvil -->
    <link rel="stylesheet" href="css/Adaptación celular.css">
</head>

<body>

    <header>
        <h1>🛠️ Quotixx 📐</h1>
        <p>Cotización para Carpintería</p>
    </header>

    <main>
        <section>
            <h2>Cotización de Closet</h2>
            <p>
                Ingresa las dimensiones y características del closet que deseas cotizar. Proporciona datos precisos para obtener un presupuesto exacto.
            </p>
        </section>

        <br><br>

        <form action="/cotizar-closet" method="POST">

            <div>
                <label for="tipoCloset">🗄️ Tipo de closet</label>
                <select id="tipoCloset" name="tipoCloset" required>
                    <option value="">Selecciona una opción</option>
                    <option value="empotrado">Empotrado</option>
                    <option value="vestidor">Vestidor (Walk-in)</option>
                    <option value="modular">Modular de pared</option>
                </select>
            </div>
               
            <br>

            <div>   
                <label for="alto">📏 Alto (en cm)</label>
                <input 
                    type="number" 
                    id="alto" 
                    name="alto" 
                    placeholder="Ingresa el alto del closet"
                    min="0"
                    max="350"
                    required>
            </div>

            <br>

            <div>
                <label for="ancho">📏 Ancho (en cm)</label>
                <input 
                    type="number" 
                    id="ancho" 
                    name="ancho" 
                    placeholder="Ingresa el ancho del closet"
                    min="0"
                    max="500"
                    required>
            </div>

            <br>

            <div>
                <label for="profundidad">📦 Profundidad (en cm)</label>
                <input 
                    type="number" 
                    id="profundidad" 
                    name="profundidad" 
                    placeholder="Ingresa la profundidad"
                    min="0"
                    max="100"
                    required>
            </div>

            <br>

            <div>
                <label for="tipoPuertas">🚪 Tipo de puertas</label>
                <select id="tipoPuertas" name="tipoPuertas" required>
                    <option value="">Selecciona una opción</option>
                    <option value="corredizas">Corredizas</option>
                    <option value="abatibles">Abatibles</option>
                    <option value="sin_puertas">Sin puertas (Abierto)</option>
                </select>
            </div>

            <br>

            <div>
                <label for="material">🪵 Material principal</label>
                <select id="material" name="material" required>
                    <option value="">Selecciona una opción</option>
                    <option value="melamina">Melamina / MDF</option>
                    <option value="madera_solida">Madera Sólida</option>
                    <option value="triplay">Triplay de Pino</option>
                </select>
            </div>

            <br>

<div>
    <label for="color">🎨 Color (Melamina / Aglomerado)</label>
    <select id="color" name="color" required>
        <option value="">Selecciona una opción</option>
        
        <!-- Maderas Clásicas y Cálidas -->
        <option value="roble_natural">Roble Natural</option>
        <option value="cedro">Cedro</option>
        <option value="caoba">Caoba</option>
        <option value="haya">Haya</option>
        <option value="rovere">Rovere</option>
        
        <!-- Maderas Oscuras y Modernas -->
        <option value="wengue">Wengué / Negro Wengue</option>
        <option value="nogal_habano">Nogal Habano</option>
        <option value="espresso">Espresso</option>
        <option value="fresno_negro">Fresno Negro</option>
        
        <!-- Tonos Rústicos y Texturizados -->
        <option value="caramelo">Caramelo / Miel</option>
        <option value="roble_provenzal">Roble Provenzal</option>
        <option value="macadamia">Macadamia</option>
        <option value="teca_limo">Teca Limo</option>
        
        <!-- Unicolores y Neutros -->
        <option value="blanco_nevado">Blanco Nevado</option>
        <option value="gris_ceniza">Gris Ceniza</option>
        <option value="gris_grafito">Gris Grafito</option>
        <option value="negro_mate">Negro Mate</option>
        <option value="taupe">Taupe / Arena</option>
        
        <!-- Texturas Piedra y Fantasía -->
        <option value="lino_textil">Lino Textil</option>
        <option value="concreto_metropolitan">Concreto / Cemento</option>
    </select>
</div>
            <br><br>

            <section>
                <button type="submit">💰 Cotizar</button>
            </section>

        </form> 

        <br>

        <section>
            <a href="nueva-cotizacion.html">◀️ Volver</a>
        </section>

    </main>

    <footer>
        <p>Versión 1.0 &nbsp; © 2026 Quotixx</p>
    </footer>
    
</body>
</html>
