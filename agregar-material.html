<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Material</title>
   <!-- Configuración Base -->
    <link rel="stylesheet" href="css/Configuración general.css">

    <!-- Estructura y Capas -->
    <link rel="stylesheet" href="css/Encabezado.css">
    <link rel="stylesheet" href="css/Contenido principal.css">
    <link rel="stylesheet" href="css/Secciones.css">
    <link rel="stylesheet" href="css/Pie de página.css">

    <!-- Componentes e Interfaz -->
    <link rel="stylesheet" href="css/Títulos.css">
    <link rel="stylesheet" href="css/Formularios.css">
    <link rel="stylesheet" href="css/Buscadores.css">
    <link rel="stylesheet" href="css/Botones.css">
    <link rel="stylesheet" href="css/Enlaces.css">
    <link rel="stylesheet" href="css/Menú principal.css">
    <link rel="stylesheet" href="css/Tarjetas.css">
    <link rel="stylesheet" href="css/Login.css">

    <!-- Adaptación Móvil -->
    <link rel="stylesheet" href="css/Adaptación celular.css">
    
</head>
<body>

  <main class="contenedor-form">
    <h2>Agregar Nuevo Material</h2>
    
    <form action="#" method="POST" id="formAgregarMaterial" class="formulario">
      <div class="grupo-campo">
        <label for="nombre">Nombre del material</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Triplex 15mm, Tornillo 2 pulg..." required>
      </div>

      <div class="grupo-campo">
        <label for="categoria">Categoría</label>
        <select id="categoria" name="categoria" required>
          <option value="" disabled selected>Selecciona una categoría</option>
          <option value="madera">Madera / Tableros</option>
          <option value="herrajes">Herrajes y Bisagras</option>
          <option value="insumos">Insumos y Pegantes</option>
          <option value="acabados">Pinturas y Barnices</option>
        </select>
      </div>

      <div class="filas-dobles">
        <div class="grupo-campo">
          <label for="unidad">Unidad de medida</label>
          <select id="unidad" name="unidad" required>
            <option value="unidad">Unidad (ud)</option>
            <option value="hoja">Hoja / Lámina</option>
            <option value="metro_lineal">Metro lineal (m)</option>
            <option value="galon">Galón / Litro</option>
            <option value="kg">Kilogramo (kg)</option>
          </select>
        </div>

        <div class="grupo-campo">
          <label for="precio">Precio unitario ($)</label>
          <input type="number" id="precio" name="precio" placeholder="0" min="0" step="50" required>
        </div>
      </div>

      <div class="grupo-campo">
        <label for="descripcion">Descripción o notas (opcional)</label>
        <textarea id="descripcion" name="descripcion" rows="3" placeholder="Detalles sobre el proveedor o especificaciones..."></textarea>
      </div>

      <div class="acciones">
        <button type="button" class="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn-guardar">Guardar Material</button>
      </div>
    </form>
  </main>

  <script src="js/main.js"></script>

  <script>
    document.querySelector('.btn-cancelar').addEventListener('click', () => {
        window.location.href = 'materiales.html';
    });

    document.getElementById('formAgregarMaterial').addEventListener('submit', async (e) => {
        e.preventDefault();

        const form = e.target;
        const boton = form.querySelector('.btn-guardar');

        const payload = {
            propietario: localStorage.getItem('usuarioEmail') || '',
            nombre: document.getElementById('nombre').value.trim(),
            categoria: document.getElementById('categoria').value,
            unidad: document.getElementById('unidad').value,
            precio: document.getElementById('precio').value,
            descripcion: document.getElementById('descripcion').value.trim()
        };

        boton.disabled = true;
        boton.textContent = 'Guardando...';

        try {
            const baseUrl = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'https://quotixx-backend.onrender.com';

            const respuesta = await fetch(`${baseUrl}/api/materiales`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const datos = await respuesta.json();

            if (respuesta.ok) {
                alert('✅ Material agregado correctamente.');
                form.reset();
            } else {
                alert(`❌ ${datos.message || 'No se pudo guardar el material.'}`);
            }
        } catch (error) {
            console.error(error);
            alert('🔴 Error al conectar con el servidor.');
        } finally {
            boton.disabled = false;
            boton.textContent = 'Guardar Material';
        }
    });
  </script>

</body>
</html>
