<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carpinfine - Nueva Contraseña</title>

<!-- Configuración Base -->
<link rel="stylesheet" href="css/Configuración general.css">

<!-- Estructura y Capas -->
<link rel="stylesheet" href="css/Encabezado.css">
<link rel="stylesheet" href="css/Contenido principal.css">
<link rel="stylesheet" href="css/Secciones.css">
<link rel="stylesheet" href="css/Pie de página.css">

<!-- Componentes e Interfaz -->
<link rel="stylesheet" href="css/Títulos.css">
<link rel="stylesheet" href="css/Formularios.css">
<link rel="stylesheet" href="css/Buscadores.css">
<link rel="stylesheet" href="css/Botones.css">
<link rel="stylesheet" href="css/Enlaces.css">
<link rel="stylesheet" href="css/Menú principal.css">
<link rel="stylesheet" href="css/Tarjetas.css">
<link rel="stylesheet" href="css/Login.css">

<!-- Adaptación Móvil (Debe ir al final para sobrescribir los estilos anteriores) -->
<link rel="stylesheet" href="css/Adaptación celular.css">

</head>

<body>

    <!-- ENCABEZADO AZUL -->
    <header>

        <h1>🛠️ Carpinfine 📐</h1>

        <p>
            Cotización para Carpintería
        </p>

    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <!-- SECCIÓN TÍTULO -->
        <section>

            <h2>
                Crear nueva contraseña 🔑
            </h2>

            <p>
                Tu nueva contraseña debe ser diferente a las anteriores
            </p>

        </section>


        <!-- FORMULARIO DE RESTABLECIMIENTO -->
        <form action="inicio.html" method="POST" id="resetForm">

            <!-- NUEVA CONTRASEÑA -->
            <div>

                <label for="password">
                    🔒 Nueva contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Mínimo 8 caracteres"
                    required
                >

            </div>


            <!-- CONFIRMAR CONTRASEÑA -->
            <div>

                <label for="confirmPassword">
                    🔒 Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Repite tu contraseña"
                    required
                >

            </div>


            <!-- REQUISITOS -->
            <div style="margin-top: 10px;">
                <p style="font-size: 0.85rem; color: #666; margin: 3px 0;">• Al menos 8 caracteres</p>
                <p style="font-size: 0.85rem; color: #666; margin: 3px 0;">• Las contraseñas coinciden</p>
            </div>


            <br>


            <!-- BOTÓN GUARDAR -->
            <div>
                <button type="submit">Guardar contraseña</button>
            </div>

        </form>


        <br>
        <br>
        <br>

        <!-- MENSAJE INFERIOR -->
        <section>

            <div>
                <p style="text-align: center;">
                    Construimos tus ideas en madera 🧰
                </p>
            </div>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer>

        <p>
            Versión 1.0 &nbsp; © 2026 Carpinfine
        </p>

    </footer>

</body>

</html>
