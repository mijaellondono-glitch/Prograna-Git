<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotixx - Agregar al Catálogo</title>

    <!-- Configuración Base -->
    <link rel="stylesheet" href="css/Configuración general.css">

    <!-- Estructura y Capas -->
    <link rel="stylesheet" href="css/Encabezado.css">
    <link rel="stylesheet" href="css/Contenido principal.css">
    <link rel="stylesheet" href="css/Secciones.css">
    <link rel="stylesheet" href="css/Pie de página.css">

    <!-- Componentes e Interfaz -->
    <link rel="stylesheet" href="css/Títulos.css">
    <link rel="stylesheet" href="css/Formularios.css">
    <link rel="stylesheet" href="css/Buscadores.css">
    <link rel="stylesheet" href="css/Botones.css">
    <link rel="stylesheet" href="css/Enlaces.css">
    <link rel="stylesheet" href="css/Menú principal.css">
    <link rel="stylesheet" href="css/Tarjetas.css">
    <link rel="stylesheet" href="css/Login.css">

    <!-- Adaptación Móvil -->
    <link rel="stylesheet" href="css/Adaptación celular.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header>
        <h1>🛠️ Quotixx 📐</h1>
        <p>Cotización para Carpintería</p>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <!-- TÍTULO DE LA PANTALLA -->
        <section>
            <h2>➕ Agregar al Catálogo</h2>
            <p>Sube la foto del mueble terminado, asígnalo a su categoría y define su precio.</p>
        </section>

        <br><br>

        <!-- FORMULARIO DE REGISTRO (enctype es OBLIGATORIO para subir imágenes) -->
        <form id="formAgregarCatalogo" action="/guardar-en-catalogo" method="POST" enctype="multipart/form-data">

            <!-- CATEGORÍA DEL MUEBLE -->
            <div>
                <label for="categoria">📁 Selecciona la Categoría</label>
                <select id="categoria" name="categoria" required>
                    <option value="">Selecciona una opción</option>
                    <option value="puertas">🚪 Puertas</option>
                    <option value="closets">🗄️ Closets / Vestidores</option>
                    <option value="cocinas">🍳 Cocinas</option>
                    <option value="camas">🛏️ Camas</option>
                    <option value="comedores">🍽️ Comedores</option>
                </select>
            </div>

            <br>

            <!-- NOMBRE O TÍTULO -->
            <div>
                <label for="nombreMueble">🏷️ Nombre / Título del Mueble</label>
                <input 
                    type="text" 
                    id="nombreMueble" 
                    name="nombreMueble" 
                    placeholder="Ej: Puerta Principal Entamborada / Closet 3 Cuerpos" 
                    required>
            </div>

            <br>

            <!-- ADJUNTAR FOTO -->
            <div>
                <label for="imagenMueble">📷 Adjuntar Foto del Trabajo</label>
                <input 
                    type="file" 
                    id="imagenMueble" 
                    name="imagenMueble" 
                    accept="image/*" 
                    required>
            </div>

            <br>

            <!-- BREVE DESCRIPCIÓN -->
            <div>
                <label for="descripcion">📝 Breve Descripción</label>
                <textarea 
                    id="descripcion" 
                    name="descripcion" 
                    rows="4" 
                    placeholder="Ej: Fabricado en melamina RH, incluye bisagras de cierre lento y jaladeras de aluminio..." 
                    required></textarea>
            </div>

            <br>

            <!-- PRECIO -->
            <div>
                <label for="precio">💰 Precio del Mueble (COP)</label>
                <input 
                    type="number" 
                    id="precio" 
                    name="precio" 
                    placeholder="Ej: 850000" 
                    min="0" 
                    required>
            </div>

            <br><br>

            <!-- BOTÓN GUARDAR -->
            <section>
                <button type="submit">✅ Guardar en Catálogo</button>
            </section>

        </form>

        <br>

        <!-- NAVEGACIÓN -->
        <section>
            <a href="productos.html">◀️ Volver al Catálogo</a>
        </section>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>Versión 1.0 &nbsp; © 2026 Quotixx</p>
    </footer>

    <script src="js/main.js"></script>

    <script>
        document.getElementById('formAgregarCatalogo').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const boton = form.querySelector('button[type="submit"]');
            const formData = new FormData(form);
            formData.append('propietario', localStorage.getItem('usuarioEmail') || '');

            boton.disabled = true;
            boton.textContent = 'Guardando...';

            try {
                const baseUrl = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'https://quotixx-backend.onrender.com';

                const respuesta = await fetch(`${baseUrl}/api/productos`, {
                    method: 'POST',
                    body: formData // No poner Content-Type manual: el navegador arma el multipart/form-data solo
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    alert('✅ Producto agregado al catálogo correctamente.');
                    form.reset();
                } else {
                    alert(`❌ ${datos.message || 'No se pudo guardar el producto.'}`);
                }
            } catch (error) {
                console.error(error);
                alert('🔴 Error al conectar con el servidor.');
            } finally {
                boton.disabled = false;
                boton.textContent = '✅ Guardar en Catálogo';
            }
        });
    </script>

</body>

</html>
