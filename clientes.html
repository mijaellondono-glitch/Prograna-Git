<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quotixx - Clientes</title>

<!-- Configuración Base -->
<link rel="stylesheet" href="css/Configuración general.css">

<!-- Estructura y Capas -->
<link rel="stylesheet" href="css/Encabezado.css">
<link rel="stylesheet" href="css/Contenido principal.css">
<link rel="stylesheet" href="css/Secciones.css">
<link rel="stylesheet" href="css/Pie de página.css">

<!-- Componentes e Interfaz -->
<link rel="stylesheet" href="css/Títulos.css">
<link rel="stylesheet" href="css/Formularios.css">
<link rel="stylesheet" href="css/Buscadores.css">
<link rel="stylesheet" href="css/Botones.css">
<link rel="stylesheet" href="css/Enlaces.css">
<link rel="stylesheet" href="css/Menú principal.css">
<link rel="stylesheet" href="css/Tarjetas.css">
<link rel="stylesheet" href="css/Login.css">

<!-- Adaptación Móvil (Debe ir al final para sobrescribir los estilos anteriores) -->
<link rel="stylesheet" href="css/Adaptación celular.css">   

</head>

<body>

    <!-- ENCABEZADO -->

    <header>

        <h1>🛠️ Quotixx 📐</h1>

        <p>
            Cotización para Carpintería
        </p>

    </header>


    <!-- CONTENIDO PRINCIPAL -->

    <main>

        <!-- TÍTULO DE LA PANTALLA -->

        <section>

            <h2>
                👤 Clientes
            </h2>

        </section>


        <!-- BUSCADOR -->

        <section>

            <label for="buscarCliente">
                🔍 Buscar cliente
            </label>

            <input
                type="search"
                id="buscarCliente"
                name="buscarCliente"
                placeholder="Buscar cliente..."
            >

        </section>

        <br><br>

        <!-- LISTA DE CLIENTES -->
        <section id="listaClientes">
            <!-- Aquí se cargan dinámicamente los clientes -->
        </section>

        <br><br>


        <!-- BOTONES -->

        <section>

            <button type="button">
                <a href="agregar-cliente.html" style="text-decoration: none; color: inherit;">
                    ➕ Agregar Cliente
                </a>
            </button>

            <a href="inicio.html">
                ◀️ Volver
            </a>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->

    <footer>

        <p>
            Versión 1.0 &nbsp; © 2026 Quotixx
        </p>

    </footer>


    <script src="js/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const contenedor = document.getElementById('listaClientes');
            const buscador = document.getElementById('buscarCliente');
            const baseUrl = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'https://quotixx-backend.onrender.com';
            let clientes = [];

            function renderizar(lista) {
                if (lista.length === 0) {
                    contenedor.innerHTML = '<p style="text-align:center;">No hay clientes registrados todavía.</p>';
                    return;
                }
                contenedor.innerHTML = lista.map(c => `
                    <div style="border:1px solid #ddd; border-radius:8px; padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
                        <div>
                            <strong>${c.nombre}</strong><br>
                            📞 ${c.telefono}${c.direccion ? `<br>📍 ${c.direccion}` : ''}
                        </div>
                        <button type="button" data-id="${c._id}" class="btnEliminarCliente" style="background:#b00020; color:white; border:none; border-radius:4px; padding:4px 10px; cursor:pointer; font-size:0.8rem; flex-shrink:0;">🗑️ Eliminar</button>
                    </div>
                `).join('');

                contenedor.querySelectorAll('.btnEliminarCliente').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        if (!confirm('¿Eliminar este cliente? Su historial de cotizaciones no se borrará, pero quedará sin cliente asociado.')) return;
                        try {
                            const res = await fetch(`${baseUrl}/api/clientes/${btn.dataset.id}`, { method: 'DELETE' });
                            if (res.ok) {
                                clientes = clientes.filter(c => c._id !== btn.dataset.id);
                                renderizar(clientes);
                            } else {
                                alert('No se pudo eliminar el cliente.');
                            }
                        } catch (err) {
                            alert('Error al conectar con el servidor.');
                        }
                    });
                });
            }

            try {
                const res = await fetch(`${baseUrl}/api/clientes`);
                clientes = res.ok ? await res.json() : [];
            } catch (err) {
                console.error('Error al cargar clientes:', err);
            }
            renderizar(clientes);

            if (buscador) {
                buscador.addEventListener('input', () => {
                    const texto = buscador.value.trim().toLowerCase();
                    renderizar(clientes.filter(c =>
                        c.nombre.toLowerCase().includes(texto) || c.telefono.includes(texto)
                    ));
                });
            }
        });
    </script>

</body>

</html>
