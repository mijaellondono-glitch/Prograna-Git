<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotización de Comedor - Quotixx</title>

    <!-- Configuración Base -->
    <link rel="stylesheet" href="css/Configuración general.css">

    <!-- Estructura y Capas -->
    <link rel="stylesheet" href="css/Encabezado.css">
    <link rel="stylesheet" href="css/Contenido principal.css">
    <link rel="stylesheet" href="css/Secciones.css">
    <link rel="stylesheet" href="css/Pie de página.css">

    <!-- Componentes e Interfaz -->
    <link rel="stylesheet" href="css/Títulos.css">
    <link rel="stylesheet" href="css/Formularios.css">
    <link rel="stylesheet" href="css/Buscadores.css">
    <link rel="stylesheet" href="css/Botones.css">
    <link rel="stylesheet" href="css/Enlaces.css">
    <link rel="stylesheet" href="css/Menú principal.css">
    <link rel="stylesheet" href="css/Tarjetas.css">
    <link rel="stylesheet" href="css/Login.css">

    <!-- Adaptación Móvil -->
    <link rel="stylesheet" href="css/Adaptación celular.css">
</head>

<body>

    <header>
        <h1>🛠️ Quotixx 📐</h1>
        <p>Cotización para Carpintería</p>
    </header>

    <main>
        <section>
            <h2>Cotización de Comedor</h2>
            <p>
                Selecciona la forma de la mesa, la cantidad de puestos y el tipo de material para obtener tu presupuesto de comedor.
            </p>
        </section>

        <br><br>

        <form action="/cotizar-comedor" method="POST">

            <div>
                <label for="puestos">🪑 Cantidad de puestos</label>
                <select id="puestos" name="puestos" required>
                    <option value="">Selecciona una opción</option>
                    <option value="4_puestos">4 Puestos</option>
                    <option value="6_puestos">6 Puestos</option>
                    <option value="8_puestos">8 Puestos</option>
                    <option value="10_puestos">10 Puestos</option>
                </select>
            </div>
               
            <br>

            <div>
                <label for="incluyeSillas">🍽️ Incluye sillas o solo mesa</label>
                <select id="incluyeSillas" name="incluyeSillas" required>
                    <option value="">Selecciona una opción</option>
                    <option value="juego_completo">Juego completo (Mesa + Sillas)</option>
                    <option value="solo_mesa">Solo la mesa</option>
                    <option value="mesa_y_banca">Mesa + Sillas + Banca auxiliar</option>
                </select>
            </div>

            <br>

            <div>
                <label for="forma">📐 Forma de la mesa</label>
                <select id="forma" name="forma" required>
                    <option value="">Selecciona una opción</option>
                    <option value="rectangular">Rectangular</option>
                    <option value="cuadrada">Cuadrada</option>
                    <option value="redonda">Redonda</option>
                    <option value="ovalada">Ovalada</option>
                </select>
            </div>

            <br>

            <div>   
                <label for="largoMesa">📏 Largo / Diámetro de la mesa (en cm)</label>
                <input 
                    type="number" 
                    id="largoMesa" 
                    name="largoMesa" 
                    placeholder="Ej: 140 para 4 puestos o 180 para 6 puestos"
                    min="0"
                    max="400"
                    required>
            </div>

            <br>

            <div>   
                <label for="anchoMesa">📏 Ancho de la mesa (en cm)</label>
                <input 
                    type="number" 
                    id="anchoMesa" 
                    name="anchoMesa" 
                    placeholder="Ej: 90 cm (Dejar en blanco si es redonda)"
                    min="0"
                    max="200">
            </div>

            <br>

            <div>
                <label for="material">🪵 Tipo de madera / Material</label>
                <select id="material" name="material" required>
                    <option value="">Selecciona una opción</option>
                    <option value="melamina">Melamina / Aglomerado</option>
                    <option value="madera_solida">Madera Sólida (Cedro / Roble)</option>
                    <option value="triplay">Triplay de Pino</option>
                </select>
            </div>

            <br>

            <div>
                <label for="color">🎨 Color</label>
                <select id="color" name="color" required>
                    <option value="">Selecciona una opción</option>
                    <option value="blanco">Blanco</option>
                    <option value="miel">Miel</option>
                    <option value="caramelo">Caramelo</option>
                    <option value="wengue">Negro Wengué</option>
                </select>
            </div>

            <br><br>

            <section>
                <button type="submit">💰 Cotizar</button>
            </section>

        </form> 

        <br>

        <section>
            <a href="nueva-cotizacion.html">◀️ Volver</a>
        </section>

    </main>

    <footer>
        <p>Versión 1.0 &nbsp; © 2026 Quotixx</p>
    </footer>
    
</body>
</html>
