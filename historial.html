<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quotixx - Historial</title>

<!-- Configuración Base -->
<link rel="stylesheet" href="css/Configuración general.css">

<!-- Estructura y Capas -->
<link rel="stylesheet" href="css/Encabezado.css">
<link rel="stylesheet" href="css/Contenido principal.css">
<link rel="stylesheet" href="css/Secciones.css">
<link rel="stylesheet" href="css/Pie de página.css">

<!-- Componentes e Interfaz -->
<link rel="stylesheet" href="css/Títulos.css">
<link rel="stylesheet" href="css/Formularios.css">
<link rel="stylesheet" href="css/Buscadores.css">
<link rel="stylesheet" href="css/Botones.css">
<link rel="stylesheet" href="css/Enlaces.css">
<link rel="stylesheet" href="css/Menú principal.css">
<link rel="stylesheet" href="css/Tarjetas.css">
<link rel="stylesheet" href="css/Login.css">

<!-- Adaptación Móvil (Debe ir al final para sobrescribir los estilos anteriores) -->
<link rel="stylesheet" href="css/Adaptación celular.css">

</head>

<body>

    <!-- ENCABEZADO -->

    <header>

        <h1>🛠️ Quotixx 📐</h1>

        <p>
            Cotización para Carpintería
        </p>

    </header>


    <!-- CONTENIDO PRINCIPAL -->

    <main>

        <!-- TÍTULO DE LA PANTALLA -->

        <section>

            <h2>
                📄 Historial
            </h2>

        </section>


        <!-- BUSCADOR -->

        <section>

            <label for="buscarCotizacion">
                🔍 Buscar cotización
            </label>

            <input
                type="search"
                id="buscarCotizacion"
                name="buscarCotizacion"
                placeholder="Buscar cotización..."
            >

        </section>


        <!-- LISTA DE COTIZACIONES -->

        <section id="listaHistorial">
            <!-- Aquí se cargan dinámicamente las cotizaciones -->
        </section>

        <br><br>


        <!-- BOTÓN VOLVER -->

        <section>

            <a href="inicio.html">
                ◀️ Volver
            </a>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->

    <footer>

        <p>
            Versión 1.0 &nbsp; © 2026 Quotixx
        </p>

    </footer>


    <script src="js/main.js"></script>

    <script>
        // ==========================================
        // PANTALLA: Historial de Cotizaciones
        // Autor: Mijael Londoño Uribe
        // Descripción: Consume la API /api/cotizaciones para mostrar
        // el historial del negocio logueado, permite buscar por
        // cliente/tipo de mueble, y eliminar una cotización.
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            // Referencias a los elementos del DOM que se van a usar
            const contenedor = document.getElementById('listaHistorial');
            const buscador = document.getElementById('buscarCotizacion');
            // API_BASE_URL viene declarado en js/main.js; si por alguna razón
            // no cargó, se usa esta URL de respaldo
            const baseUrl = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'https://quotixx-backend.onrender.com';
            let cotizaciones = []; // Guarda en memoria la lista completa, para poder filtrarla sin volver a pedirla al servidor

            // Colores para la "etiqueta" de estado de cada cotización
            const colorEstado = { Pendiente: '#997404', Aprobada: '#0f5132', Rechazada: '#842029' };
            const fondoEstado = { Pendiente: '#fff3cd', Aprobada: '#d1e7dd', Rechazada: '#f8d7da' };

            // Dibuja en pantalla la lista de cotizaciones recibida
            function renderizar(lista) {
                if (lista.length === 0) {
                    contenedor.innerHTML = '<p style="text-align:center;">No hay cotizaciones registradas todavía.</p>';
                    return;
                }
                // Convierte cada cotización en una tarjeta HTML
                contenedor.innerHTML = lista.map(c => `
                    <div style="border:1px solid #ddd; border-radius:8px; padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
                        <div>
                            <strong>${c.cliente ? c.cliente.nombre : 'Cliente eliminado'}</strong>
                            ${c.cliente ? ` — 📞 ${c.cliente.telefono}` : ''}<br>
                            <span style="text-transform:capitalize;">${c.tipoMueble}</span> — ${c.detalle || ''}<br>
                            <small>${new Date(c.fecha).toLocaleDateString('es-CO')}</small>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-weight:bold; color:#004085;">$${Number(c.total).toLocaleString('es-CO')} COP</div>
                            <span style="display:inline-block; margin-top:4px; padding:3px 10px; border-radius:12px; font-size:0.8rem; background:${fondoEstado[c.estado] || '#eee'}; color:${colorEstado[c.estado] || '#333'};">${c.estado}</span>
                            <br>
                            <button type="button" data-id="${c._id}" class="btnEliminarCotizacion" style="margin-top:6px; background:#b00020; color:white; border:none; border-radius:4px; padding:4px 10px; cursor:pointer; font-size:0.8rem;">🗑️ Eliminar</button>
                        </div>
                    </div>
                `).join('');

                // Conecta el botón "Eliminar" de cada tarjeta recién creada
                contenedor.querySelectorAll('.btnEliminarCotizacion').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        // Confirmación antes de borrar, para evitar clics accidentales
                        if (!confirm('¿Eliminar esta cotización del historial? Esta acción no se puede deshacer.')) return;
                        try {
                            // Se envía el propietario para que el backend confirme
                            // que esta cotización sí le pertenece a este negocio
                            const propietario = localStorage.getItem('usuarioEmail') || '';
                            const res = await fetch(`${baseUrl}/api/cotizaciones/${btn.dataset.id}?propietario=${encodeURIComponent(propietario)}`, { method: 'DELETE' });
                            if (res.ok) {
                                // Actualiza la lista en memoria y vuelve a dibujar, sin recargar la página
                                cotizaciones = cotizaciones.filter(c => c._id !== btn.dataset.id);
                                renderizar(cotizaciones);
                            } else {
                                alert('No se pudo eliminar la cotización.');
                            }
                        } catch (err) {
                            alert('Error al conectar con el servidor.');
                        }
                    });
                });
            }

            // Al cargar la página: pide al backend el historial de ESTE negocio
            try {
                const propietario = localStorage.getItem('usuarioEmail') || '';
                const res = await fetch(`${baseUrl}/api/cotizaciones?propietario=${encodeURIComponent(propietario)}`);
                cotizaciones = res.ok ? await res.json() : [];
            } catch (err) {
                console.error('Error al cargar el historial:', err);
            }
            renderizar(cotizaciones); // Primer dibujo de la lista completa

            // Buscador en tiempo real: filtra por nombre de cliente o tipo de mueble
            // sin volver a consultar el servidor (usa la lista que ya está en memoria)
            if (buscador) {
                buscador.addEventListener('input', () => {
                    const texto = buscador.value.trim().toLowerCase();
                    renderizar(cotizaciones.filter(c =>
                        (c.cliente && c.cliente.nombre.toLowerCase().includes(texto)) ||
                        c.tipoMueble.toLowerCase().includes(texto)
                    ));
                });
            }
        });
    </script>

</body>

</html>
