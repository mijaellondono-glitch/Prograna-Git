<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuotiXX - Agregar Cliente</title>

<!-- Configuración Base -->
<link rel="stylesheet" href="css/Configuración general.css">

<!-- Estructura y Capas -->
<link rel="stylesheet" href="css/Encabezado.css">
<link rel="stylesheet" href="css/Contenido principal.css">
<link rel="stylesheet" href="css/Secciones.css">
<link rel="stylesheet" href="css/Pie de página.css">

<!-- Componentes e Interfaz -->
<link rel="stylesheet" href="css/Títulos.css">
<link rel="stylesheet" href="css/Formularios.css">
<link rel="stylesheet" href="css/Buscadores.css">
<link rel="stylesheet" href="css/Botones.css">
<link rel="stylesheet" href="css/Enlaces.css">
<link rel="stylesheet" href="css/Menú principal.css">
<link rel="stylesheet" href="css/Tarjetas.css">
<link rel="stylesheet" href="css/Login.css">

<!-- Adaptación Móvil (Debe ir al final para sobrescribir los estilos anteriores) -->
<link rel="stylesheet" href="css/Adaptación celular.css">

</head>

<body>

    <!-- ENCABEZADO AZUL -->
    <header>

        <h1>🛠️ QuotiXX 📐</h1>

        <p>
            Cotización para Carpintería
        </p>

    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <!-- SECCIÓN TÍTULO -->
        <section>

            <h2>
                Nuevo Cliente 👤
            </h2>

            <p>
                Ingresa los datos del cliente para asociarlo a tus cotizaciones
            </p>

        </section>


        <!-- FORMULARIO AGREGAR CLIENTE -->
        <form action="#" method="POST" id="clienteForm">

            <!-- NOMBRE COMPLETO -->
            <div>

                <label for="nombreCliente">
                    👤 Nombre completo
                </label>

                <input
                    type="text"
                    id="nombreCliente"
                    name="nombreCliente"
                    placeholder="Ej: Juan Pérez"
                    required
                >

            </div>


            <br>


            <!-- TELÉFONO / WHATSAPP -->
            <div>

                <label for="telefono">
                    📞 Teléfono / WhatsApp
                </label>

                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Ej: 3001234567"
                    required
                >

            </div>


            <br>




            <!-- DIRECCIÓN DE ENTREGA / INSTALACIÓN -->
            <div>

                <label for="direccion">
                    📍 Dirección de instalación
                </label>

                <input
                    type="text"
                    id="direccion"
                    name="direccion"
                    placeholder="Ej: Calle 45 # 12 - 34, Barrio... (opcional)"
                >

            </div>


            <br>


            


            <br>
            <br>


            <!-- BOTÓN GUARDAR CLIENTE -->
            <div>
                <button type="submit">Guardar Cliente</button>
                
            </div>
            
        <section>
            <a href="nueva-cotizacion.html">◀️ Volver</a>
        </section>
        </form>


        <br>
        <br>

        <!-- MENSAJE INFERIOR -->
        <section>

            <div>
                <p style="text-align: center;">
                    Construimos tus ideas en madera 🧰
                </p>
            </div>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer>

        <p>
            Versión 1.0 &nbsp; © 2026 QuotiXX
        </p>

    </footer>

    <script src="js/main.js"></script>

    <script>
        document.getElementById('clienteForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const boton = form.querySelector('button[type="submit"]');

            const payload = {
                nombre: document.getElementById('nombreCliente').value.trim(),
                telefono: document.getElementById('telefono').value.trim(),
                direccion: document.getElementById('direccion').value.trim()
            };

            boton.disabled = true;
            boton.textContent = 'Guardando...';

            try {
                const baseUrl = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'https://quotixx-backend.onrender.com';

                const respuesta = await fetch(`${baseUrl}/api/clientes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    alert('✅ Cliente guardado correctamente.');
                    window.location.href = 'clientes.html';
                } else {
                    alert(`❌ ${datos.message || 'No se pudo guardar el cliente.'}`);
                }
            } catch (error) {
                console.error(error);
                alert('🔴 Error al conectar con el servidor.');
            } finally {
                boton.disabled = false;
                boton.textContent = 'Guardar Cliente';
            }
        });
    </script>

</body>

</html>
